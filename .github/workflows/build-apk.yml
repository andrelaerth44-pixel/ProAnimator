name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform & build-tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore WorkspaceScreen
        run: python3 scripts/decode_workspace_screen.py

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set +e
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build_output.log
          code=${PIPESTATUS[0]}
          echo "===== COMPILE ERRORS ====="
          grep -E "e: file:|error:|FAILED|Unresolved reference|Compilation error" build_output.log || true
          echo "===== END ERRORS ====="
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          if-no-files-found: ignore

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ProAnimator-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
